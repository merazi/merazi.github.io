baseURL = 'https://merazi.github.io/'
languageCode = 'en-us'
title = 'Merazi'
theme = 'barebones'

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[outputs]
home = ['HTML', 'RSS']

[pagination]
pagerSize = 10

[markup]
[markup.highlight]
codeFences = true
noClasses = false
lineNos = false

[params]
description = "Notes on Linux, old hardware, digital minimalism, and productivity."
author = 'Merazi'
DateFormat = "Jan 2, 2006"

# Social links (rendered in footer)
[[params.socialIcons]]
name = 'mastodon'
url = 'https://mastodon.social/@ttydweller'

[[params.socialIcons]]
name = 'github'
url = 'https://github.com/merazi'

[[params.socialIcons]]
name = 'rss'
url = '/index.xml'

# Navigation Menu
[menu]

[[menu.main]]
identifier = 'posts'
name = 'Posts'
url = '/posts/'
weight = 10

[[menu.main]]
identifier = 'archives'
name = 'Archive'
url = '/archives/'
weight = 20

[[menu.main]]
identifier = 'tags'
name = 'Tags'
url = '/tags/'
weight = 30

[[menu.main]]
identifier = 'music'
