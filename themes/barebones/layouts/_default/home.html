{{ define "main" }}
<p><img src="{{ "logo.png" | relURL }}" alt="{{ .Site.Title }}" width="120" height="120"></p>
<p><em>My little corner of the internet.</em></p>

<h2>Recent Posts</h2>
<ul class="post-list">
  {{ range first 10 (where .Site.RegularPages "Section" "posts") }}
  <li>
    <span class="post-date">{{ .Date.Format "Jan 2, 2006" }}</span> &mdash;
    <a href="{{ .Permalink }}">{{ .Title }}</a>
  </li>
  {{ end }}
</ul>
<p><a href="{{ "posts/" | relURL }}">All posts &rarr;</a></p>
{{ end }}
