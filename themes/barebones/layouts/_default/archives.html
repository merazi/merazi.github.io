{{ define "main" }}
<h1>{{ .Title }}</h1>
{{ $pages := where .Site.RegularPages "Section" "posts" }}
{{ $byYear := $pages.GroupByDate "2006" }}
{{ range $byYear }}
<h2>{{ .Key }}</h2>
<ul class="post-list">
  {{ range .Pages }}
  <li>
    <span class="post-date">{{ .Date.Format "Jan 2" }}</span> &mdash;
    <a href="{{ .Permalink }}">{{ .Title }}</a>
  </li>
  {{ end }}
</ul>
{{ end }}
{{ end }}
