{{- if .Params.mastodon_url }}
<div class="mastodon-post-cta" style="margin-top: 2rem; margin-bottom: 2rem; padding: 1.25rem; border: 1px dashed var(--border); border-radius: var(--radius); background: var(--entry); text-align: center;">
  <p style="margin: 0; font-size: 0.95rem; line-height: 1.6;">
    💬 <strong>Have thoughts or feedback?</strong><br>
    <a href="{{ .Params.mastodon_url }}" target="_blank" rel="noopener noreferrer" style="font-weight: 600; text-decoration: underline; color: var(--primary);">
      Join the discussion on Mastodon ↗
    </a>
  </p>
</div>
{{- end }}
